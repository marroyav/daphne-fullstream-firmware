name: Formal

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-04-08'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FuseSoC
        run: python3 -m pip install --user 'fusesoc==2.4.3'

      - name: Check generated source manifests
        run: |
          ./scripts/fusesoc/refresh_cores.sh
          git diff --exit-code -- cores/generated/daphne-fullstream-ip.core

      - name: Check scripts and documentation
        run: |
          sh -n scripts/fusesoc/check_build_outputs.sh
          sh -n scripts/fusesoc/package_fullstream_overlay.sh
          sh -n scripts/fusesoc/run_vivado_batch.sh
          sh -n scripts/fusesoc/vivado_batch_hook.sh
          sh -n tests/scripts/check_build_outputs_fail_closed_test.sh
          sh -n tests/scripts/post_vivado_packaging_test.sh
          ./tests/scripts/check_build_outputs_fail_closed_test.sh
          ./tests/scripts/post_vivado_packaging_test.sh
          python3 -m py_compile scripts/check_fullstream_artifact_map.py
          python3 scripts/check_documentation.py
          python3 scripts/check_register_map.py

      - name: Run GHDL smoke tests
        run: ./scripts/fusesoc/run_logic_test.sh

      - name: Run formal suite
        run: ./scripts/formal/run_formal.sh

      - name: Upload failed formal logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-failure-logs
          path: |
            formal/sby/**/logfile.txt
            formal/sby/**/engine_0/trace*.vcd
            formal/sby/**/model/design*.log
          if-no-files-found: warn
          retention-days: 14
